# OpenRouter preset — FEDOTLLM_LLM_API_KEY=sk-or-v1-...
llm:
  provider: openrouter
  # The only generative model used by the research loop. Improve retrieval,
  # runtime evidence and feedback instead of escalating to expensive models.
  model_name: z-ai/glm-5.3-flash
  # Keep campaigns comparable: a provider failure is an infrastructure result,
  # not an implicit model change halfway through the experiment.
  fallback_models: ""
  base_url: https://openrouter.ai/api/v1
  api_key: ${oc.env:FEDOTLLM_LLM_API_KEY}
  caching:
    enabled: false
  extra_headers:
    HTTP-Referer: https://github.com/aimclub/FEDOT.LLM
    X-Title: FEDOT.LLM-EvolveAgent
  completion_params:
    # The cheap reasoning model produced valid high-context Fixer answers at
    # 109s and repeatedly lost the next repair at the old 120s boundary.  Keep
    # a finite ceiling, but leave enough wall-clock for the same model rather
    # than escalating to a more expensive fallback.
    timeout: 180
    seed: 42
    # GLM is a reasoning model. Low effort is sufficient for bounded Scout/Fixer
    # tool decisions and prevents hidden reasoning from consuming the whole
    # completion budget before a structured answer is emitted.
    reasoning:
      effort: low
    # Includes reasoning tokens on OpenRouter. Both stage clients honor this
    # explicit budget so reasoning cannot exhaust a hidden smaller Scout cap.
    max_tokens: 8000
embeddings:
  provider: openrouter
  model_name: openai/text-embedding-3-small
  base_url: https://openrouter.ai/api/v1
  api_key: ${oc.env:FEDOTLLM_LLM_API_KEY}
  extra_headers:
    HTTP-Referer: https://github.com/aimclub/FEDOT.LLM
    X-Title: FEDOT.LLM-EvolveAgent
langfuse:
  host: https://cloud.langfuse.com
  public_key: null
  secret_key: null
evolve:
  reader_model: z-ai/glm-5.3-flash
  fixer_model: z-ai/glm-5.3-flash
