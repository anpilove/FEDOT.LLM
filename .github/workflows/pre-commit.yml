name: Pre-commit checks

on:
  push:
    branches: [ main, research/evolve-agent ]
  pull_request:
    branches: [ main, research/evolve-agent ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python 3.10
      run: uv python install 3.10

    - name: Run pre-commit hooks
      run: |
        uvx --python 3.10 --from pre-commit==4.2.0 pre-commit run --all-files --show-diff-on-failure